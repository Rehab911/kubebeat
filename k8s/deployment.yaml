apiVersion: apps/v1
kind: Deployment
metadata:
  name: audio-service
  labels:
    app: audio-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audio-service
  template:
    metadata:
      labels:
        app: audio-service
    spec:
      containers:
        - name: audio-service
          image: audio-service:v1
          imagePullPolicy: Never # Tells K8s to use the image we built natively inside the VM
          ports:
            - containerPort: 5001
---
apiVersion: v1
kind: Service
metadata:
  name: audio-service
spec:
  type: NodePort
  selector:
    app: audio-service
  ports:
    - protocol: TCP
      port: 5001
      targetPort: 5001
